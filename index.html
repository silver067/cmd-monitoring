<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMD Monitoring - Live</title>
<style>
  *{box-sizing:border-box} body{font-family:Inter,Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px}
  h1{font-size:24px} .top{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  input,select,button{padding:10px 14px;border-radius:10px;border:0;font-size:14px}
  input{background:#1e293b;color:#fff;outline:none;flex:1;min-width:160px}
  button{background:#22c55e;color:#000;font-weight:700;cursor:pointer}
  button.secondary{background:#334155;color:#fff}
  .status{font-size:13px;color:#94a3b8}
  .status.live{color:#22c55e;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px}
  .card h3{margin:0 0 6px} .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .online{background:#14532d;color:#86efac} .offline{background:#450a0a;color:#fca5a5} .busy{background:#422006;color:#fde68a}
  .card p{color:#94a3b8;font-size:13px;margin:8px 0}
  .row{display:flex;gap:8px;margin-top:10px} .row button{flex:1}
  .del{background:#ef4444!important;color:#fff}
</style>
</head>
<body>
<h1>🖥️ CMD Monitoring <span style="font-size:14px;color:#94a3b8">- LIVE SYNC</span></h1>
<div class="status" id="conn">● Connecting to Firebase...</div>

<div class="top">
  <input id="nameInput" placeholder="Computer name e.g. PC-01 / TV-Lobby">
  <select id="statusInput"><option value="online">Online</option><option value="busy">Busy</option><option value="offline">Offline</option></select>
  <button onclick="addPC()">+ Add Computer</button>
  <button class="secondary" onclick="clearAll()">Clear All</button>
</div>

<div class="grid" id="grid"></div>
<p style="color:#64748b;font-size:12px">Live URL: silver067.github.io/cmd-monitoring — All devices share this same Firebase database.</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, push, update } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvLBqdWJwO1mbH2OTpmQ48h-aeWbAfsMI",
  authDomain: "cmd-monitoring.firebaseapp.com",
  databaseURL: "https://cmd-monitoring-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cmd-monitoring",
  storageBucket: "cmd-monitoring.firebasestorage.app",
  messagingSenderId: "308391391362",
  appId: "1:308391391362:web:14e93e008dab4b539a449b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const pcsRef = ref(db, 'computers');

const grid = document.getElementById('grid');
const conn = document.getElementById('conn');

onValue(pcsRef, (snap)=>{
  conn.textContent = '● LIVE - Connected to Firebase';
  conn.className = 'status live';
  const data = snap.val() || {};
  grid.innerHTML = '';
  Object.entries(data).forEach(([id, pc])=>{
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>${pc.name || 'PC'}</h3>
      <span class="badge ${pc.status}">${(pc.status||'online').toUpperCase()}</span>
      <p>Last update: ${pc.updatedAt ? new Date(pc.updatedAt).toLocaleTimeString() : 'now'}</p>
      <div class="row">
        <button onclick="window.setStatus('${id}','online')">Online</button>
        <button class="secondary" onclick="window.setStatus('${id}','busy')">Busy</button>
        <button class="secondary" onclick="window.setStatus('${id}','offline')">Offline</button>
      </div>
      <div class="row"><button class="del" onclick="window.deletePC('${id}')">Delete</button></div>
    `;
    grid.appendChild(div);
  });
  if(Object.keys(data).length===0) grid.innerHTML = '<p style="color:#94a3b8">No computers yet. Add one above — it will appear on ALL devices instantly.</p>';
});

window.addPC = async ()=>{
  const name = document.getElementById('nameInput').value.trim();
  const status = document.getElementById('statusInput').value;
  if(!name) return alert('Type a computer name first');
  const newRef = push(pcsRef);
  await set(newRef, { name, status, updatedAt: Date.now() });
  document.getElementById('nameInput').value = '';
};
window.setStatus = async (id, status)=>{
  await update(ref(db, 'computers/'+id), { status, updatedAt: Date.now() });
};
window.deletePC = async (id)=>{
  if(confirm('Delete this computer?')) await remove(ref(db, 'computers/'+id));
};
window.clearAll = async ()=>{
  if(confirm('Clear ALL computers for all devices?')) await set(pcsRef, null);
};
</script>
</body>
</html>
